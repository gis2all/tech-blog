name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Check Astro and TypeScript
        run: npm run check

      - name: Lint and format (Biome)
        run: npm run lint

      - name: Type-check admin shell scripts
        run: npm run check:admin

      - name: Run Vitest
        run: npm test

      - name: Run Vitest coverage
        run: npm run test:coverage

      - name: Generate coverage badge
        run: npm run coverage:badge

      - name: Run Playwright Chromium tests
        run: npm run test:e2e

      - name: Build site
        run: npm run build

      - name: Free port 4321 for Lighthouse
        run: fuser -k 4321/tcp || true

      - name: Verify Lighthouse performance budgets
        run: npm run perf

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload coverage report for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: coverage

  deploy-coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Deploy coverage report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
