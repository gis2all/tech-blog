<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose Cover</title>
  <desc id="desc">A container grid cover for Docker Compose development notes.</desc>
  <rect width="1280" height="720" fill="#153947"/>
  <g fill="#55bdc8" opacity=".85">
    <rect x="170" y="180" width="150" height="100" rx="6"/>
    <rect x="350" y="180" width="150" height="100" rx="6"/>
    <rect x="530" y="180" width="150" height="100" rx="6"/>
    <rect x="710" y="180" width="150" height="100" rx="6"/>
    <rect x="890" y="180" width="150" height="100" rx="6"/>
    <rect x="350" y="310" width="150" height="100" rx="6"/>
    <rect x="530" y="310" width="150" height="100" rx="6"/>
    <rect x="710" y="310" width="150" height="100" rx="6"/>
  </g>
  <text x="160" y="540" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">DOCKER COMPOSE</text>
  <text x="160" y="594" fill="#c7e8ec" font-family="Arial, sans-serif" font-size="24">DEV STACK / HEALTHCHECK / VOLUME</text>
</svg>
