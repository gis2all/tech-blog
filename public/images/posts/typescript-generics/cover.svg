<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TypeScript Generics Cover</title>
  <desc id="desc">A code-style cover for TypeScript generics.</desc>
  <rect width="1280" height="720" fill="#18324a"/>
  <rect x="110" y="110" width="1060" height="500" rx="8" fill="#101318" stroke="#2c333d"/>
  <text x="160" y="205" fill="#55bdc8" font-family="Consolas, monospace" font-size="34">function request&lt;T&gt;(url: string): Promise&lt;T&gt;</text>
  <text x="160" y="285" fill="#f4b860" font-family="Consolas, monospace" font-size="34">keyof FormModel</text>
  <text x="160" y="365" fill="#ffffff" font-family="Consolas, monospace" font-size="34">EventMap[K]</text>
  <text x="160" y="500" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">TYPE SYSTEM</text>
</svg>
